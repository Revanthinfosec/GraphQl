        "segmentCount": 9384,
        "origin": "string",
        "finalDestination": "string",
        "route": [
          "string",
          "string"
        ],
        "firstDeparture": "2005-11-04T15:48:47.326Z",
        "lastArrival": "1981-02-21T17:14:31.570Z",
        "totalTripMinutes": 8496
      }
order: 1000
