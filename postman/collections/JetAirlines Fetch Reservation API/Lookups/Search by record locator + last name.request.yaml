$kind: http-request
description: Manage-booking lookup (Find your trip).
url: "{{baseUrl}}/api/reservations/search?recordLocator={{recordLocator}}&lastName={{lastName}}"
method: GET
queryParams:
  recordLocator: "{{recordLocator}}"
  lastName: "{{lastName}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
order: 2000
